<!-- 16. 3-Strip Photobooth Window -->
<div id="photobooth-win" class="ui-window" style="top: 100px; left: 880px;" onmousedown="bringToFront(this)">
    <div class="window-header" onmousedown="startDrag(event, this)">
        <span class="window-title">Photobooth.exe</span>
        <div class="window-controls">
            <button onclick="minimizeWindow('photobooth-win')">_</button>
            <button onclick="closeWindow('photobooth-win')">X</button>
        </div>
    </div>
    <div class="window-content" style="text-align: center;">
        <div class="world-status-tag">Active Reality: 1984</div>
        <h2>1Q84 Photobooth</h2>
        <p class="section-subtitle">Capture 3 frames in the alternate reality.</p>
        
        <!-- Photobooth Strip Preview -->
        <div id="photobooth-strip" class="photo-strip">
            <div class="photo-frame" id="frame-1"><span>Frame 1</span></div>
            <div class="photo-frame" id="frame-2"><span>Frame 2</span></div>
            <div class="photo-frame" id="frame-3"><span>Frame 3</span></div>
        </div>

        <div class="photobooth-controls">
            <div id="booth-timer" class="booth-timer-display">Ready</div>
            <button id="start-booth-btn" class="char-btn" onclick="startPhotobooth()">Take 3-Strip Photo</button>
            <button id="share-ig-btn" class="char-btn hidden" onclick="shareToIGStory()">Share to IG Stories</button>
        </div>
    </div>
</div>
