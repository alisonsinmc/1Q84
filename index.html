<!-- 2. Midnight Kitchen Window -->
<div id="kitchen-win" class="ui-window minimized" style="top: 100px; left: 500px;" onmousedown="bringToFront(this)">
    <div class="window-header" onmousedown="startDrag(event, this)">
        <span class="window-title">Reminder: Midnight_Kitchen.txt</span>
        <div class="window-controls">
            <button onclick="minimizeWindow('kitchen-win')">_</button>
            <button onclick="closeWindow('kitchen-win')">X</button>
        </div>
    </div>
    <div class="window-content">
        <div class="world-status-tag">Active Reality: 1984</div>
        <h2>Food as Ritual</h2>
        <p class="section-subtitle">Click a recipe card to flip open the book.</p>
        <div id="recipe-select-view" class="recipe-grid">
            <div class="recipe-card" onclick="openRecipeBook('spaghetti')">
                <div class="sketch-frame"><span class="ascii-art">~[ 🍝 ]~</span></div>
                <h3>Spaghetti</h3>
            </div>
            <div class="recipe-card" onclick="openRecipeBook('whiskey')">
                <div class="sketch-frame"><span class="ascii-art">[ 🥃 ]</span></div>
                <h3>Cutty Sark</h3>
            </div>
            <div class="recipe-card" onclick="openRecipeBook('sandwich')">
                <div class="sketch-frame"><span class="ascii-art">&lt;[ 🥪 ]&gt;</span></div>
                <h3>Sandwich</h3>
            </div>
        </div>
        <div id="recipe-book-view" class="recipe-book-page hidden">
            <button class="back-to-menu" onclick="closeRecipeBook()">← Back to Index</button>
            <div class="recipe-book-inner">
                <!-- Replaced ASCII emoji container with your custom drawing -->
                <div class="recipe-image-frame">
                    <img id="recipe-book-img" src="" alt="Recipe Drawing" class="recipe-drawn-img">
                </div>
                <div class="recipe-text-content">
                    <h3 id="recipe-book-title">Title</h3>
                    <p id="recipe-book-desc">Desc...</p>
                </div>
            </div>
        </div>
    </div>
</div>
