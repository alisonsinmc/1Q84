<!-- 3. Character Dossier Window -->
<div id="dossier-win" class="ui-window minimized" style="top: 120px; left: 530px;" onmousedown="bringToFront(this)">
    <div class="window-header" onmousedown="startDrag(event, this)">
        <span class="window-title">Dossier: Character_Database</span>
        <div class="window-controls">
            <button onclick="minimizeWindow('dossier-win')">_</button>
            <button onclick="closeWindow('dossier-win')">X</button>
        </div>
    </div>
    <div class="window-content">
        <div class="world-status-tag" id="tag-dossier">Active Reality: 1984</div>
        <div class="char-tabs">
            <button class="char-btn active" onclick="loadCharacter('aomame')">Aomame</button>
            <button class="char-btn" onclick="loadCharacter('tengo')">Tengo</button>
        </div>
        
        <!-- Character Portrait Frame -->
        <div class="dossier-img-frame">
            <img id="char-image" src="aomame.png" alt="Character Portrait" class="window-portrait">
        </div>

        <div id="char-display" class="char-card">
            <h3 id="char-name">Aomame</h3>
            <p id="char-desc">• Role: Fitness Instructor / Assassin<br>• Status: Navigating ordinary Tokyo streets.</p>
        </div>
    </div>
</div>
